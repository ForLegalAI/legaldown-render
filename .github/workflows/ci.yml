name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  conformance:
    name: Specification examples and fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the LegalDown specification
        uses: actions/checkout@v4
        with:
          repository: ForLegalAI/LegalDown
          ref: v0.2
          path: .legaldown-spec
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q -m conformance
        env:
          LEGALDOWN_SPEC_DIR: .legaldown-spec

  validator-main:
    # Surfaces changes in legaldown-validator's model before they are released
    # (docs/decisions/0001). Informational: a failure here is a heads-up.
    name: Against legaldown-validator main
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # The validator from main first, so the renderer's own range for it is
      # satisfied before a release of that version is on PyPI.
      - run: pip install "legaldown-validator @ git+https://github.com/ForLegalAI/legaldown-validator@main"
      - run: pip install -e ".[dev]"
      - run: pytest -q
