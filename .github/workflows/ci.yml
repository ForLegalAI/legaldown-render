name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Called by publish.yml, so a release is only built once these jobs pass.
  workflow_call:

permissions:
  contents: read

env:
  # The LegalDown specification release the conformance job renders; the one
  # place to change it when the renderer moves to a later specification.
  LEGALDOWN_SPEC_REF: v0.2

# In a called workflow, github.workflow is the *caller's* name ("Publish"), not
# "CI". That keeps this group apart from the push/pull-request CI runs on the
# same ref, so a dispatched or release publish neither cancels nor is cancelled
# by them, and it never collides with publish.yml's own group (two workflows in
# one group would wait for each other forever).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install ruff
      - run: ruff check .

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows: path handling, console encodings and line endings differ.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  conformance:
    name: Specification examples and fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check out the LegalDown specification
        uses: actions/checkout@v7
        with:
          repository: ForLegalAI/LegalDown
          ref: ${{ env.LEGALDOWN_SPEC_REF }}
          path: .legaldown-spec
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q -m conformance
        env:
          LEGALDOWN_SPEC_DIR: .legaldown-spec

  docx:
    # The DOCX writer is checked against the ISO/IEC 29500 schemas (fetched, not stored: tests/schemas/README.md)
    # and against LibreOffice, which opens each document, updates its fields and says what it shows
    # (tests/lo/uno_export.py runs under the system Python, which python3-uno provides, not the virtual
    # environment's). A missing tool fails the job instead of skipping the tests.
    name: DOCX (schemas and LibreOffice)
    runs-on: ubuntu-latest
    env:
      LEGALDOWN_REQUIRE_DOCX_TOOLS: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Check out the LegalDown specification (its documents are validated too)
        uses: actions/checkout@v7
        with:
          repository: ForLegalAI/LegalDown
          ref: ${{ env.LEGALDOWN_SPEC_REF }}
          path: .legaldown-spec
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer python3-uno
      - name: Show the versions of the system and of LibreOffice
        run: |
          lsb_release -ds || cat /etc/os-release
          soffice --version
      - run: pip install -e ".[dev]"
      - name: Cache the OOXML schemas
        id: schemas
        uses: actions/cache@v6
        with:
          path: tests/schemas/ooxml
          key: ooxml-schemas-${{ hashFiles('tests/schemas/fetch.py') }}
      - if: steps.schemas.outputs.cache-hit != 'true'
        run: python tests/schemas/fetch.py
      - run: pytest -q -m ooxml_schema
        env:
          LEGALDOWN_SPEC_DIR: .legaldown-spec
      # The acceptance corpus (tests/test_docx_acceptance.py) is part of both runs; it needs the specification's documents
      - run: pytest -q -m libreoffice
        env:
          LEGALDOWN_SPEC_DIR: .legaldown-spec

  validator-main:
    # Surfaces changes in legaldown-validator's model before they are released
    # (docs/decisions/0001). Informational: a failure here is a heads-up.
    name: Against legaldown-validator main
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      # Force-reinstalled last, with --no-deps, so main is tested even when its
      # version is outside the renderer's range.
      - run: pip install --force-reinstall --no-deps "legaldown-validator @ git+https://github.com/ForLegalAI/legaldown-validator@main"
      - run: pytest -q
