[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[project]
name = "legaldown-render"
# Single-sourced from src/legaldown_render/__init__.py.
dynamic = ["version"]
description = "Reference renderer for the LegalDown legal document format: HTML, plain text and DOCX (live Word numbering and fields), PDF planned"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ForLegalAI s.r.o." }]
maintainers = [{ name = "ForLegalAI s.r.o." }]
keywords = ["legaldown", "legal", "contracts", "legaltech", "markdown", "renderer", "html", "docx", "word"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: HTML",
    "Typing :: Typed",
]
dependencies = [
    # The only LegalDown parser (docs/decisions/0002). A minor bump may change
    # the model, so the range is pinned to one minor version.
    "legaldown-validator>=0.4.0,<0.5",
    # Inline Markdown (emphasis, links, code spans) within the validator's
    # blocks, parsed in inline mode only (docs/decisions/0007).
    "markdown-it-py>=4.2,<5",
    # CLDR locale data for dates, money, and durations (docs/decisions/0005).
    "babel>=2.18,<3",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# lxml validates the DOCX parts against the OOXML schemas in the tests (tests/schemas/README.md).
# pytest-xdist is optional: `pytest -n auto` runs the suite on all cores (a third of the time).
dev = ["pytest>=9.2", "ruff>=0.17", "build>=1.6", "lxml>=6.1", "pytest-xdist>=3.8"]

[project.scripts]
legaldown-render = "legaldown_render.cli:main"

[project.urls]
Homepage = "https://github.com/ForLegalAI/legaldown-render"
Repository = "https://github.com/ForLegalAI/legaldown-render"
Issues = "https://github.com/ForLegalAI/legaldown-render/issues"
Specification = "https://github.com/ForLegalAI/LegalDown"

[tool.hatch.version]
path = "src/legaldown_render/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/legaldown_render"]

[tool.hatch.build.targets.sdist]
include = ["src/legaldown_render", "tests", "docs", "README.md", "CONFORMANCE.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
markers = [
    "conformance: renders the LegalDown specification's examples and fixtures (needs a checkout of the specification)",
    "ooxml_schema: validates DOCX parts against the ISO/IEC 29500 schemas (needs lxml and the schemas: python tests/schemas/fetch.py)",
    "libreoffice: opens DOCX files in LibreOffice and compares what it shows (needs soffice and python3-uno)",
    "acceptance: the DOCX acceptance corpus (tests/test_docx_acceptance.py); left out of a run that names no marker (-m), unless LEGALDOWN_ACCEPTANCE is set or the file is named",
]
# A deprecated legaldown-validator API fails the tests: the next minor
# release removes it, and the dependency range admits only one minor version.
# Every deprecation the validator raises is of this one category.
filterwarnings = [
    "error::legaldown.LegaldownDeprecationWarning",
]
