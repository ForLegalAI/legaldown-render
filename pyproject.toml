[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legaldown-render"
# Single-sourced from src/legaldown_render/__init__.py.
dynamic = ["version"]
description = "Reference renderer for the LegalDown legal document format: HTML and plain text, DOCX and PDF planned"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ForLegalAI s.r.o." }]
maintainers = [{ name = "ForLegalAI s.r.o." }]
keywords = ["legaldown", "legal", "contracts", "legaltech", "markdown", "renderer", "html"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: HTML",
    "Typing :: Typed",
]
dependencies = [
    # The only LegalDown parser (docs/decisions/0002). A minor bump may change
    # the model, so the range is pinned to one minor version.
    "legaldown-validator>=0.3.0,<0.4",
    # Inline Markdown (emphasis, links, code spans) within the validator's
    # blocks, parsed in inline mode only (docs/decisions/0007).
    "markdown-it-py>=3.0,<5",
    # CLDR locale data for dates, money, and durations (docs/decisions/0005).
    "babel>=2.14,<3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "build>=1.2"]

[project.scripts]
legaldown-render = "legaldown_render.cli:main"

[project.urls]
Homepage = "https://github.com/ForLegalAI/legaldown-render"
Repository = "https://github.com/ForLegalAI/legaldown-render"
Issues = "https://github.com/ForLegalAI/legaldown-render/issues"
Specification = "https://github.com/ForLegalAI/LegalDown"

[tool.hatch.version]
path = "src/legaldown_render/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/legaldown_render"]

[tool.hatch.build.targets.sdist]
include = ["src/legaldown_render", "tests", "docs", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
markers = [
    "conformance: renders the LegalDown specification's examples and fixtures (needs a checkout of the specification)",
]
